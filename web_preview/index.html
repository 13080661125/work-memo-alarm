<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#89CFF0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="短腿备忘录" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.jpg" type="image/jpeg" />
<link rel="apple-touch-icon" href="icon.jpg" />
<title>短腿备忘录</title>
<style>
/* ==========================================================================
   基础变量与重置：简约商务风格（浅色系）
   ========================================================================== */
:root{
  --primary:#2563EB;        /* 主色：商务蓝 */
  --primary-soft:#EFF4FF;   /* 主色浅底 */
  --bg:#F4F6F9;             /* 页面背景 */
  --card:#FFFFFF;           /* 卡片背景 */
  --text:#1F2937;           /* 主文字 */
  --text2:#6B7280;          /* 次要文字 */
  --text3:#9CA3AF;          /* 辅助文字 */
  --border:#E8EBF0;         /* 分隔线 */
  --high:#EF4444;           /* 优先级-高 */
  --mid:#F59E0B;            /* 优先级-中 */
  --low:#10B981;            /* 优先级-低 */
  --danger:#EF4444;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#E9EDF2;                 /* 桌面浏览器上 App 外的底色 */
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
input,textarea{outline:none;border:0;background:transparent;}

/* ==========================================================================
   外层容器：手机上铺满，桌面上居中成"手机窗口"
   ========================================================================== */
.app{
  position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  /* 背景：柯基草地水彩图 + 半透明白蒙版，保证文字可读 */
  background-image:linear-gradient(rgba(244,246,249,.80), rgba(244,246,249,.80)), url('corgi_bg.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:520px){
  .app{height:100vh;box-shadow:0 10px 40px rgba(16,24,40,.16);}
}

/* ---------------- 顶部标题栏 ---------------- */
.hd{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--card);border-bottom:1px solid var(--border);
}
.hd-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:.3px;}
.hd-title img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.hd-btn{
  font-size:13px;color:var(--primary);background:var(--primary-soft);
  padding:6px 12px;border-radius:20px;font-weight:500;
}
.hd-btn:active{opacity:.7;}

/* ---------------- 内容区 ---------------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 96px;}
@media (min-width:520px){ main{padding-bottom:24px;} }

/* ---------------- 底部标签栏 ---------------- */
.tabbar{
  flex:none;display:flex;background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 7px;color:var(--text3);font-size:11px;
}
.tab.on{color:var(--primary);}
.tab svg{width:23px;height:23px;}
@media (min-width:520px){ .tab{padding:10px 0;} }

/* ---------------- 悬浮新增按钮 ---------------- */
.fab{
  position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 66px);
  width:54px;height:54px;border-radius:50%;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(37,99,235,.36);z-index:20;
}
.fab:active{transform:scale(.94);}
.fab svg{width:26px;height:26px;}

/* ---------------- 搜索框 ---------------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:10px;}
.search svg{width:17px;height:17px;color:var(--text3);flex:none;}
.search input{flex:1;font-size:15px;}
.search .clear{color:var(--text3);font-size:18px;line-height:1;padding:0 2px;}

/* ---------------- 排序选择条 ---------------- */
.sorts{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
.sorts::-webkit-scrollbar{display:none;}
.chip{
  flex:none;padding:6px 12px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);color:var(--text2);font-size:12.5px;white-space:nowrap;
}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500;}
.chip.wide{flex:1;text-align:center;}
.chip:active{opacity:.75;}

/* ---------------- 卡片 ---------------- */
.card{
  position:relative;background:rgba(255,255,255,.86);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
}
.card-row{display:flex;align-items:flex-start;gap:11px;padding:13px 14px 13px 16px;}
.card-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}   /* 优先级色条 */
.card-main{flex:1;min-width:0;}
.card-title{font-size:15.5px;font-weight:600;word-break:break-all;}
.card-sub{font-size:13px;color:var(--text2);margin-top:3px;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
  font-size:11.5px;color:var(--text3);}
.card-meta svg{width:13px;height:13px;vertical-align:-2px;}
.tag{padding:2px 7px;border-radius:5px;font-size:11px;line-height:1.5;}
.tag.h{background:#FEE2E2;color:#B91C1C;}
.tag.m{background:#FEF3C7;color:#B45309;}
.tag.l{background:#D1FAE5;color:#047857;}
.done .card-title{text-decoration:line-through;color:var(--text3);}
.done .card-sub{color:var(--text3);}
.gray{filter:grayscale(1);opacity:.5;}

/* 复选框 */
.check{
  flex:none;width:23px;height:23px;border-radius:50%;border:1.8px solid #C9CFD8;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.check.on{background:var(--primary);border-color:var(--primary);}
.check svg{width:14px;height:14px;color:#fff;opacity:0;}
.check.on svg{opacity:1;}

/* 删除按钮 */
.del{flex:none;width:32px;height:32px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--text3);}
.del svg{width:17px;height:17px;}
.del:active{background:#FEE2E2;color:var(--danger);}

/* ---------------- 闹钟卡片 ---------------- */
.a-time{font-size:30px;font-weight:300;letter-spacing:1px;line-height:1.1;font-variant-numeric:tabular-nums;}
.a-time small{font-size:14px;font-weight:400;margin-left:4px;color:var(--text2);}
.a-label{font-size:14px;color:var(--text2);margin-top:2px;}
.switch{flex:none;width:46px;height:27px;border-radius:20px;background:#D7DCE4;
  position:relative;transition:background .18s;}
.switch.on{background:var(--primary);}
.switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on i{transform:translateX(19px);}

/* ---------------- 空状态 ---------------- */
.empty{text-align:center;padding:70px 20px;color:var(--text3);}
.empty svg{width:56px;height:56px;color:#D3D9E2;margin-bottom:12px;}
.empty p{margin:5px 0;font-size:13.5px;}

/* ---------------- 分组标题 ---------------- */
.sec{font-size:12px;color:var(--text3);margin:14px 2px 8px;font-weight:500;}

/* ==========================================================================
   编辑抽屉（全屏面板）
   ========================================================================== */
.sheet{
  position:fixed;inset:0;z-index:60;display:none;
}
.sheet.show{display:block;}
.sheet .mask{position:absolute;inset:0;background:rgba(17,24,39,.38);}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(255,255,255,.96);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.32,.72,.3,1);
}
.sheet.show .panel{transform:translateY(0);}
@media (min-width:520px){
  .sheet .panel{max-width:480px;margin:0 auto;top:0;}
}
.sheet-hd{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px 16px;
  background:var(--card);border-bottom:1px solid var(--border);
}
.sheet-hd .t{font-size:16.5px;font-weight:600;}
.sheet-hd .cancel{color:var(--text2);font-size:15px;padding:4px 6px;}
.sheet-hd .save{color:#fff;background:var(--primary);font-size:14px;
  padding:7px 18px;border-radius:18px;font-weight:500;}
.sheet-bd{flex:1;overflow-y:auto;padding:14px 14px 40px;}
.blk{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:4px 14px;margin-bottom:12px;}
.blk input,.blk textarea{width:100%;padding:12px 0;font-size:15px;resize:none;}
.blk textarea{min-height:120px;line-height:1.65;}
.blk .line{border-top:1px solid var(--border);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0;min-height:50px;}
.row + .row{border-top:1px solid var(--border);}
.row .lb{font-size:14.5px;flex:none;}
.row .val{font-size:14px;color:var(--text2);}
.row input[type=time]{font-size:15px;color:var(--text);background:var(--primary-soft);
  padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums;}
.hint{font-size:12px;color:var(--text3);padding:0 2px 10px;line-height:1.6;}
.pri{display:flex;gap:8px;}
.pri .chip{flex:1;}
.danger-txt{color:var(--danger);}

/* ==========================================================================
   响铃全屏页
   ========================================================================== */
.ring{
  position:fixed;inset:0;z-index:100;display:none;
  background-image:linear-gradient(rgba(240,250,250,.86), rgba(240,250,250,.86)), url('corgi_bg.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  color:var(--text);flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
}
.ring.show{display:flex;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ring .bell{width:74px;height:74px;margin-bottom:26px;animation:shake 1s infinite;}
@keyframes shake{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
.ring .rt{font-size:62px;font-weight:200;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.ring .rl{font-size:18px;margin-top:8px;opacity:.92;word-break:break-all;}
.ring .rs{font-size:13.5px;margin-top:10px;opacity:.75;}
.ring .btns{display:flex;gap:14px;margin-top:52px;width:100%;max-width:330px;}
.ring .btns button{
  flex:1;padding:15px 0;border-radius:14px;font-size:15.5px;font-weight:600;
}
.ring .b-snooze{background:rgba(255,255,255,.7);border:1.5px solid var(--primary);color:var(--primary);}
.ring .b-stop{background:var(--primary);color:#fff;}
.ring button:active{opacity:.8;}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:rgba(17,24,39,.9);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13.5px;z-index:120;opacity:0;transition:opacity .22s;pointer-events:none;
}
.toast.show{opacity:1;}

/* 说明弹窗 */
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:26px;}
.modal.show{display:flex;}
.modal .mask{position:absolute;inset:0;background:rgba(17,24,39,.45);}
.modal .box{position:relative;background:#fff;border-radius:16px;padding:20px 18px;
  max-width:400px;width:100%;max-height:76vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 10px;font-size:16.5px;}
.modal p,.modal li{font-size:13.5px;color:var(--text2);line-height:1.75;}
.modal ul{padding-left:18px;margin:8px 0;}
.modal .ok{margin-top:16px;width:100%;background:var(--primary);color:#fff;
  padding:12px 0;border-radius:12px;font-size:15px;font-weight:600;}
.modal b{color:var(--text);}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hd">
    <div class="hd-title" id="hdTitle"><img src="icon.jpg" alt="短腿备忘录">短腿备忘录</div>
    <button class="hd-btn" data-act="about">使用说明</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button class="tab" data-act="tab" data-tab="memo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18H6z" stroke="currentColor" stroke-width="1.7"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>备忘录</span>
    </button>
    <button class="tab" data-act="tab" data-tab="alarm">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13.5" r="7.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 10v3.5l2.5 1.8M9.5 2.5h5M4.8 5.6l2 2.6M19.2 5.6l-2 2.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>闹钟</span>
    </button>
  </nav>
  <button class="fab" data-act="add" id="fab">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- 编辑面板 -->
<div class="sheet" id="sheet"><div class="mask" data-act="sheetClose"></div><div class="panel" id="panel"></div></div>
<!-- 响铃页 -->
<div class="ring" id="ring"></div>
<!-- 提示 -->
<div class="toast" id="toast"></div>
<!-- 说明弹窗 -->
<div class="modal" id="modal"><div class="mask" data-act="modalClose"></div><div class="box" id="modalBox"></div></div>

<script>
/* ==========================================================================
 * 工作备忘录 + 闹钟提醒 —— 浏览器版
 * 说明：本文件为「原生 App 的高保真浏览器版」，功能与 Flutter 版一致，
 *      数据保存在浏览器 localStorage（关掉浏览器也不丢）。
 * 与原生版的差异见页面右上角「使用说明」。
 * ========================================================================== */

/* ------------------------------ 工具函数 ------------------------------ */
var $ = function(s, r){ return (r||document).querySelector(s); };
/** HTML 转义，防止用户输入破坏页面结构 */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){ return String(n).padStart(2,'0'); }
function hhmm(h,m){ return pad(h)+':'+pad(m); }
/** 时间戳 -> "9月9日 14:30" */
function fmtTime(ts){
  var d = new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
}
/** 生成唯一 ID */
function uid(p){ return (p||'x') + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
/** 提示条 */
var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ------------------------------ 常量定义 ------------------------------ */
var KEY = { memo:'wma_memos_v1', alarm:'wma_alarms_v1', cfg:'wma_cfg_v1' };
var PRI = {
  high:{ name:'高', cls:'h', color:'var(--high)' },
  mid: { name:'中', cls:'m', color:'var(--mid)'  },
  low: { name:'低', cls:'l', color:'var(--low)'  }
};
var PRI_ORDER = { high:3, mid:2, low:1 };
var WEEK = ['一','二','三','四','五','六','日'];          // 1=周一 ... 7=周日
/* 内置铃声：全部用 Web Audio 实时合成，无需下载音频文件 */
var RINGS = {
  classic:{ name:'经典闹铃', period:1300, notes:[[880,0,300,'square'],[880,400,300,'square'],[660,820,300,'square']] },
  gentle: { name:'温柔晨曲', period:2400, notes:[[523,0,420,'sine'],[659,420,420,'sine'],[784,840,760,'sine']] },
  digital:{ name:'数字滴答', period:1600, notes:[[1200,0,70,'square'],[1200,220,70,'square'],[1200,440,70,'square'],[1200,660,70,'square']] },
  bell:   { name:'商务铃声', period:2000, notes:[[660,0,900,'triangle'],[990,110,820,'triangle']] }
};

/* ------------------------------ 全局状态 ------------------------------ */
var memos = [], alarms = [];
var cfg = { ring:'classic', vibrate:true };
var ui = { tab:'memo', kw:'', sort:'created_desc', editing:null };

/* ------------------------------ 数据持久化 ------------------------------ */
function load(){
  try{ memos  = JSON.parse(localStorage.getItem(KEY.memo)  || '[]'); }catch(e){ memos = []; }
  try{ alarms = JSON.parse(localStorage.getItem(KEY.alarm) || '[]'); }catch(e){ alarms = []; }
  try{ var c = JSON.parse(localStorage.getItem(KEY.cfg) || '{}'); for(var k in c){ cfg[k] = c[k]; } }catch(e){}
  if(!RINGS[cfg.ring]) cfg.ring = 'classic';
}
function save(){
  try{
    localStorage.setItem(KEY.memo,  JSON.stringify(memos));
    localStorage.setItem(KEY.alarm, JSON.stringify(alarms));
    localStorage.setItem(KEY.cfg,   JSON.stringify(cfg));
  }catch(e){ toast('本地存储写入失败：' + e.message); }
}

/* ==========================================================================
 * 铃声播放：Web Audio API 合成
 * ========================================================================== */
var AC = null;
function ac(){
  if(!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
/** 播放单个音符：freq 频率(Hz)，delayMs 相对延迟，durMs 时长，type 波形 */
function tone(freq, delayMs, durMs, type){
  var ctx = ac(); if(!ctx) return;
  var t0 = ctx.currentTime + delayMs/1000, dur = durMs/1000;
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.32, t0 + 0.02);      // 快速起音，避免爆音
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);     // 自然衰减
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
var ringTimer = null, vibeTimer = null;
/** 试听 / 播放一遍 */
function playOnce(kind){
  var r = RINGS[kind] || RINGS.classic;
  r.notes.forEach(function(n){ tone(n[0], n[1], n[2], n[3]); });
}
/** 循环播放（闹钟响铃用） */
function startRinging(alarm){
  var kind = (alarm && alarm.ring) || cfg.ring;
  var r = RINGS[kind] || RINGS.classic;
  ac(); playOnce(kind);
  clearInterval(ringTimer);
  ringTimer = setInterval(function(){ playOnce(kind); }, r.period);
  // 震动（安卓 Chrome 支持；iOS Safari 不支持，静默失败）
  if(cfg.vibrate && alarm && alarm.vibrate !== false && navigator.vibrate){
    try{
      navigator.vibrate([900,400,900,400]);
      clearInterval(vibeTimer);
      vibeTimer = setInterval(function(){ navigator.vibrate([900,400,900,400]); }, 3600);
    }catch(e){}
  }
}
function stopRinging(){
  clearInterval(ringTimer); ringTimer = null;
  clearInterval(vibeTimer); vibeTimer = null;
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
}

/* ==========================================================================
 * 闹钟触发逻辑
 * ========================================================================== */
var firedKey = {};   // 防止同一分钟重复触发
/** 计算下一次响铃时间文案 */
function nextRingText(a){
  if(!a.enabled) return '已关闭';
  var now = new Date();
  var reps = (a.repeat && a.repeat.length) ? a.repeat : null;
  for(var i=0; i<8; i++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    var dow = d.getDay()===0 ? 7 : d.getDay();
    if(reps && reps.indexOf(dow) === -1) continue;
    if(i === 0){
      if(a.hour > now.getHours() || (a.hour === now.getHours() && a.minute > now.getMinutes()))
        return '今天 ' + hhmm(a.hour, a.minute);
      continue;
    }
    if(i === 1) return '明天 ' + hhmm(a.hour, a.minute);
    return '周' + WEEK[dow-1] + ' ' + hhmm(a.hour, a.minute);
  }
  return '—';
}
/** 每秒检查一次是否有闹钟到点 */
function tick(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var dow = now.getDay()===0 ? 7 : now.getDay();
  var dayKey = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();

  alarms.forEach(function(a){
    // 1) 贪睡到点
    if(a.enabled && a.snoozeUntil && Date.now() >= a.snoozeUntil && !a.snoozeFired){
      a.snoozeFired = true; save();
      fire(a, '（贪睡提醒）');
      return;
    }
    if(!a.enabled) return;
    // 2) 正常到点：小时分钟匹配，且今天是重复日（或一次性）
    var reps = (a.repeat && a.repeat.length) ? a.repeat : null;
    if(h !== a.hour || m !== a.minute) return;
    if(reps && reps.indexOf(dow) === -1) return;
    var key = a.id + '@' + dayKey + ' ' + hhmm(h, m);
    if(firedKey[key]) return;
    firedKey[key] = true;
    fire(a, '');
  });
}
/** 弹出全屏响铃页 */
function fire(a, suffix){
  delete a.snoozeUntil; a.snoozeFired = false; save();
  startRinging(a);
  // 页面在后台时，同时发一条系统通知
  if(document.hidden && window.Notification && Notification.permission === 'granted'){
    try{ new Notification('闹钟提醒 · ' + hhmm(a.hour, a.minute), { body:(a.label||'闹钟') + suffix }); }catch(e){}
  }
  var ring = $('#ring');
  ring.innerHTML =
    '<svg class="bell" viewBox="0 0 24 24" fill="none">' +
      '<path d="M12 3a5.5 5.5 0 0 0-5.5 5.5c0 4.2-1.5 5.6-1.5 5.6h14s-1.5-1.4-1.5-5.6A5.5 5.5 0 0 0 12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M10.2 18a2 2 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
    '<div class="rt">' + hhmm(a.hour, a.minute) + '</div>' +
    '<div class="rl">' + esc(a.label || '闹钟') + esc(suffix) + '</div>' +
    '<div class="rs">' + ((a.repeat && a.repeat.length) ? repeatText(a.repeat) : '单次提醒') + '</div>' +
    '<div class="btns">' +
      '<button class="b-snooze" data-act="snooze" data-id="' + a.id + '">贪睡 10 分钟</button>' +
      '<button class="b-stop" data-act="stopRing" data-id="' + a.id + '">关闭提醒</button>' +
    '</div>';
  ring.classList.add('show');
}
/** 关闭提醒 */
function stopRing(a){
  stopRinging();
  $('#ring').classList.remove('show');
  // 一次性闹钟响过之后自动停用
  if(!a.repeat || a.repeat.length === 0){
    a.enabled = false; save(); render();
  }
}
/** 贪睡 10 分钟 */
function snooze(a){
  stopRinging();
  $('#ring').classList.remove('show');
  a.snoozeUntil = Date.now() + 10*60*1000;
  a.snoozeFired = false;
  save(); render();
  toast('已贪睡，10 分钟后再次提醒');
}

/* ==========================================================================
 * 渲染：列表
 * ========================================================================== */
function repeatText(reps){
  if(!reps || !reps.length) return '仅一次';
  if(reps.length === 7) return '每天';
  var work = [1,2,3,4,5], weekend = [6,7];
  if(work.every(function(d){ return reps.indexOf(d) > -1; }) && reps.length === 5) return '工作日';
  if(weekend.every(function(d){ return reps.indexOf(d) > -1; }) && reps.length === 2) return '周末';
  return '周' + reps.slice().sort().map(function(d){ return WEEK[d-1]; }).join(' ');
}

/* ------------------------------ 备忘录列表 ------------------------------ */
function sortedMemos(){
  var kw = ui.kw.trim().toLowerCase();
  var list = memos.filter(function(m){
    if(!kw) return true;
    return (m.title || '').toLowerCase().indexOf(kw) > -1 || (m.content || '').toLowerCase().indexOf(kw) > -1;
  });
  list.sort(function(a, b){
    if(ui.sort === 'created_desc') return b.createdAt - a.createdAt;
    if(ui.sort === 'created_asc')  return a.createdAt - b.createdAt;
    if(ui.sort === 'pri_desc'){
      var d = PRI_ORDER[b.priority] - PRI_ORDER[a.priority];
      return d !== 0 ? d : b.createdAt - a.createdAt;
    }
    var d2 = PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
    return d2 !== 0 ? d2 : b.createdAt - a.createdAt;
  });
  return list;
}
var SORTS = [
  ['created_desc','最新创建'], ['created_asc','最早创建'],

function saveMemo(id){
  var title = $('#f_title').value.trim();

  var ed = ui.editing || {};
  if(!title && !content){ toast('标题和正文不能都为空'); return; }
  var m = id ? memos.filter(function(x){ return x.id === id; })[0] : null;
  if(!m){ m = { id:uid('m'), createdAt:Date.now() }; memos.push(m); }
  m.title = title || '未命名备忘录';
  m.content = content;
  m.priority = ed.priority || m.priority || 'mid';

  // 处理绑定闹钟
  var timeVal = $('#f_time') ? $('#f_time').value : '09:00';
  var parts = (timeVal || '09:00').split(':');
  var hour = parseInt(parts[0], 10) || 0, minute = parseInt(parts[1], 10) || 0;
  var reps = ed.repeat || [];
  if(ed.remind){
    var a = m.alarmId ? alarms.filter(function(x){ return x.id === m.alarmId; })[0] : null;
    if(!a){ a = { id:uid('a'), source:'memo', memoId:m.id }; alarms.push(a); }
    a.hour = hour; a.minute = minute; a.repeat = reps.slice();
    a.label = m.title; a.ring = cfg.ring; a.vibrate = true; a.enabled = true;
    delete a.snoozeUntil; a.snoozeFired = false;
    m.alarmId = a.id;
    toast('已设置提醒：' + hhmm(hour, minute));
  }else if(m.alarmId){
    // 关闭提醒：移除绑定闹钟
    alarms = alarms.filter(function(x){ return x.id !== m.alarmId; });
    m.alarmId = null;
  }
  save(); closeSheet(); render();
}

/* ==========================================================================
 * 事件绑定（统一事件委托）
 * ========================================================================== */
document.addEventListener('click', function(e){
  // 首次点击解锁音频上下文（浏览器要求用户手势后才能播放声音）
  try{ ac(); }catch(err){}
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  var id  = el.getAttribute('data-id');

  /* ---- 底部标签切换 ---- */
  if(act === 'tab'){ ui.tab = el.getAttribute('data-tab'); render(); return; }

  /* ---- 新增 ---- */
  if(act === 'add'){ ui.tab === 'memo' ? editMemo(null) : editAlarm(null); return; }

  /* ---- 搜索 ---- */
  if(act === 'clearKw'){ ui.kw = ''; render(); return; }
  if(act === 'sort'){ ui.sort = el.getAttribute('data-v'); render(); return; }

  /* ---- 备忘录操作 ---- */
  if(act === 'toggleDone'){
    var m = memos.filter(function(x){ return x.id === id; })[0];
    if(m){ m.done = !m.done; save(); render(); }
    return;
  }
  if(act === 'editMemo'){ editMemo(id); return; }
  if(act === 'delMemo'){
    if(!confirm('确定删除这条备忘录吗？删除后无法恢复。')) return;
    var mm = memos.filter(function(x){ return x.id === id; })[0];
    if(mm && mm.alarmId) alarms = alarms.filter(function(x){ return x.id !== mm.alarmId; });
    memos = memos.filter(function(x){ return x.id !== id; });
    save(); closeSheet(); render(); toast('已删除');
    return;
  }

  /* ---- 备忘录编辑面板内部 ---- */
  if(act === 'pri'){ ui.editing.priority = el.getAttribute('data-v');
    var ps = $('#panel').querySelectorAll('[data-act=pri]');
    for(var i=0;i<ps.length;i++) ps[i].classList.toggle('on', ps[i] === el);
    return; }
  if(act === 'memoRemind'){ ui.editing.remind = !ui.editing.remind;
    el.classList.toggle('on', ui.editing.remind); syncMemoSheet(); return; }
  if(act === 'rep'){
    ui.editing.repeat = el.getAttribute('data-v') ? el.getAttribute('data-v').split(',').map(Number) : [];
    syncMemoSheet(); return;
  }
  if(act === 'saveMemo'){ saveMemo(id); return; }

  /* ---- 闹钟操作 ---- */
  if(act === 'toggleAlarm'){
    var a = alarms.filter(function(x){ return x.id === id; })[0];
    if(a){ a.enabled = !a.enabled; if(a.enabled){ delete a.snoozeUntil; a.snoozeFired = false; } save(); render();
           toast(a.enabled ? '闹钟已开启，下次 ' + nextRingText(a) : '闹钟已关闭'); }
    return;
  }
  if(act === 'editAlarm'){ editAlarm(id); return; }
  if(act === 'delAlarm'){
    if(!id) return;
    if(!confirm('确定删除这个闹钟吗？')) return;
    alarms = alarms.filter(function(x){ return x.id !== id; });
    memos.forEach(function(m){ if(m.alarmId === id) m.alarmId = null; });
    save(); closeSheet(); render(); toast('已删除');
    return;
  }
  if(act === 'arep'){
    ui.editing.repeat = el.getAttribute('data-v') ? el.getAttribute('data-v').split(',').map(Number) : [];
    var cs = $('#panel').querySelectorAll('[data-act=arep]');
    var cur = (ui.editing.repeat||[]).join(',');
    for(var j=0;j<cs.length;j++) cs[j].classList.toggle('on', cs[j].getAttribute('data-v') === cur);
    var tx = $('#a_rep_txt'); if(tx) tx.textContent = repeatText(ui.editing.repeat);
    return;
  }
  if(act === 'ring'){
    ui.editing.ring = el.getAttribute('data-v');
    var rs = $('#panel').querySelectorAll('[data-act=ring]');
    for(var k=0;k<rs.length;k++) rs[k].classList.toggle('on', rs[k] === el);
    playOnce(ui.editing.ring);          // 试听
    return;
  }
  if(act === 'vib'){ ui.editing.vibrate = !ui.editing.vibrate; el.classList.toggle('on', ui.editing.vibrate); return; }
  if(act === 'aon'){ ui.editing.enabled = !ui.editing.enabled; el.classList.toggle('on', ui.editing.enabled); return; }
  if(act === 'saveAlarm'){
    var timeVal = $('#a_time').value || '09:00';
    var p2 = timeVal.split(':');
    var hour = parseInt(p2[0],10) || 0, minute = parseInt(p2[1],10) || 0;
    var al = id ? alarms.filter(function(x){ return x.id === id; })[0] : null;
    if(!al){ al = { id:uid('a'), source:'standalone' }; alarms.push(al); }
    al.hour = hour; al.minute = minute;
    al.label = $('#a_label').value.trim();
    al.repeat = (ui.editing.repeat || []).slice();
    al.ring = ui.editing.ring;
    al.vibrate = ui.editing.vibrate;
    al.enabled = ui.editing.enabled;
    delete al.snoozeUntil; al.snoozeFired = false;
    save(); closeSheet(); render();
    toast(al.enabled ? '已保存，下次 ' + nextRingText(al) : '已保存（闹钟已关闭）');
    return;
  }

  /* ---- 响铃页 ---- */
  if(act === 'stopRing'){
    var sa = alarms.filter(function(x){ return x.id === id; })[0];
    if(sa) stopRing(sa); else { stopRinging(); $('#ring').classList.remove('show'); }
    return;
  }
  if(act === 'snooze'){
    var za = alarms.filter(function(x){ return x.id === id; })[0];
    if(za) snooze(za);
    return;
  }

  /* ---- 面板/弹窗 ---- */
  if(act === 'sheetClose'){ closeSheet(); return; }
  if(act === 'modalClose'){ $('#modal').classList.remove('show'); return; }

  /* ---- 使用说明 ---- */
  if(act === 'about'){ showAbout(); return; }
  if(act === 'reqNotify'){
    if(!window.Notification){ toast('当前浏览器不支持系统通知'); return; }
    Notification.requestPermission().then(function(p){
      toast(p === 'granted' ? '通知权限已开启' : '通知权限未开启：' + p);
    });
    return;
  }
  if(act === 'testRing'){
    startRinging({ ring:cfg.ring, vibrate:true });
    setTimeout(stopRinging, 3000);
    toast('试响 3 秒');
    return;
  }
});

/* 搜索框输入：实时过滤 */
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'kw'){
    ui.kw = e.target.value;
    var pos = e.target.selectionStart;               // 保持光标位置，避免输入时跳动
    var scroll = $('#main').scrollTop;
    $('#main').innerHTML = viewMemo();
    $('#main').scrollTop = scroll;
    var nk = $('#kw');
    if(nk){ nk.focus(); try{ nk.setSelectionRange(pos, pos); }catch(err){} }
  }
});

/* ==========================================================================
 * 使用说明弹窗
 * ========================================================================== */
function showAbout(){
  var nPerm = (window.Notification ? Notification.permission : 'unsupported');
  var h = '<h3>使用说明</h3>' +
    '<p>• 如何「添加到主屏幕」：浏览器右下角...菜单 →共享→查看更多→ 添加到主屏幕，之后可像 App 一样全屏打开。</p>' +
    '<p style="margin-top:12px">系统通知权限：<b>' +
      (nPerm === 'granted' ? '已开启' : nPerm === 'denied' ? '已被拒绝' : nPerm === 'unsupported' ? '浏览器不支持' : '未申请') +
    '</b></p>' +
    (nPerm === 'default' ? '<button class="ok" data-act="reqNotify" style="margin-top:8px;background:var(--primary-soft);color:var(--primary)">申请通知权限（后台时也能弹提醒）</button>' : '') +
    '<button class="ok" data-act="testRing" style="margin-top:8px;background:#F3F4F6;color:var(--text)">试听当前铃声（3 秒）</button>' +
    '<button class="ok" data-act="modalClose">我知道了</button>';
  $('#modalBox').innerHTML = h;
  $('#modal').classList.add('show');
}

/* ==========================================================================
 * 启动
 * ========================================================================== */
(function init(){
  load();
  // 首次使用时放两条示例数据，方便立刻看到效果
  if(!memos.length && !alarms.length){
    var t = Date.now();
    memos.push({ id:uid('m'), title:'示例：每周一提交周报', content:'每周一 10:00 前把上周工作汇总发到部门群，包含进展、风险和下周计划。',
                 priority:'high', done:false, createdAt:t, alarmId:null });
    memos.push({ id:uid('m'), title:'示例：整理客户会议纪要', content:'把今天与客户的沟通要点归档，标注待跟进事项。',
                 priority:'mid', done:false, createdAt:t-3600*1000, alarmId:null });
    var d = new Date(Date.now() + 3*60*1000);
    alarms.push({ id:uid('a'), hour:d.getHours(), minute:d.getMinutes(), repeat:[],
                  label:'示例闹钟：3 分钟后响一次', ring:'classic', vibrate:true, enabled:true, source:'standalone' });
    save();
  }
  render();
  setInterval(tick, 1000);          // 每秒检查闹钟
  tick();
  // 页面重新可见时立即补检一次，尽量弥补后台节流造成的延迟
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ ac(); tick(); }
  });
})();
</script>
